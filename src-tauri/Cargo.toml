[package]
name = "stagesheet"
version = "0.1.0"
description = "Print-ready A4 setlists for live performers"
authors = ["Nawato"]
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "stagesheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
